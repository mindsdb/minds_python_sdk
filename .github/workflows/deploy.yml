name: Build and publish to PyPi

on:
  # This trigger fires when any workflow with this name completes, whatever its event or head
  # repository. The if: on deploy_to_pypi publishes only after a successful release-triggered
  # run whose head is in this repository. The zizmor ignore covers every trigger under on:, so
  # tests/unit/test_workflows.py fails when another trigger is added here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Run Integration Tests on Release"]
    types:
      - completed

jobs:
 #  Push a new release to PyPI
  deploy_to_pypi:
    name: Publish to PyPI
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'mindsdbadmin' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Every branch, so the next step can find this commit on main.
          fetch-depth: 0
          persist-credentials: false
      # A release tag can point at a branch commit that never merged, and that commit's own test
      # workflow decides whether the release run passes. Only a commit main already holds is
      # published.
      - name: Check that main holds the commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::$HEAD_SHA is not on main, so it is not published."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ vars.CI_PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install setuptools wheel twine
      - name: Clean previous builds
        run: rm -rf dist/ build/ ./*.egg-info
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          # Builds the version in minds/__about__.py at the tested commit. Nothing compares that
          # version with the release tag.
          python setup.py sdist
          twine upload dist/*
